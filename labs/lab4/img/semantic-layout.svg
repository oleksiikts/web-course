<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Структура семантичної сторінки</title><desc id="d">Схема сторінки: зверху header із nav, у центрі main зі section та article і бічний aside, внизу footer.</desc><rect width="640" height="300" fill="#151517"/><g font-family="Arial, sans-serif" font-size="14" fill="#fbfbfc"><rect x="20" y="16" width="600" height="46" rx="6" fill="none" stroke="#ff6243" stroke-width="2"/><text x="36" y="44">&lt;header&gt; + &lt;nav&gt;</text><rect x="20" y="76" width="410" height="150" rx="6" fill="none" stroke="#ff6243" stroke-width="2"/><text x="36" y="102">&lt;main&gt;</text><rect x="36" y="114" width="378" height="42" rx="4" fill="#ff6243" opacity=".35"/><text x="48" y="140">&lt;article&gt;</text><rect x="36" y="166" width="378" height="46" rx="4" fill="#ff6243" opacity=".2"/><text x="48" y="194">&lt;section&gt; · &lt;figure&gt;</text><rect x="444" y="76" width="176" height="150" rx="6" fill="none" stroke="#ff6243" stroke-width="2" stroke-dasharray="6 4"/><text x="460" y="102">&lt;aside&gt;</text><rect x="20" y="240" width="600" height="44" rx="6" fill="none" stroke="#ff6243" stroke-width="2"/><text x="36" y="267">&lt;footer&gt; + &lt;address&gt;</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
